<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="description" content="لسان — تطبيق ذكي لتحليل الجمل العربية إعرابياً باستخدام الذكاء الاصطناعي">

    <title>لسان — تحليل النحو العربي</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>

<body>

    <!-- ═══ Fixed Header ═══ -->
    <header class="app-header">
        <div class="header-inner">
            <h1 class="logo">لِسَان</h1>
            <p class="tagline">تحليل النحو العربي بالذكاء الاصطناعي</p>
        </div>
    </header>

    <div class="app-container">

        <!-- ═══ Input Section ═══ -->
        <section class="card input-section">
            <div class="card-title">
                <span class="icon">✦</span>
                أدخل الجملة
            </div>

            <textarea id="sentence-input" placeholder="اكتب الجملة العربية هنا..." spellcheck="false"
                autocomplete="off"></textarea>

            <!-- Power Level Selector -->
            <div class="power-level-group">
                <div class="power-label">مستوى القوة:</div>
                <div class="power-selector">
                    <button class="power-btn active" data-power="strong">
                        قوي
                    </button>
                    <button class="power-btn" data-power="med">
                        متوسط
                    </button>
                    <button class="power-btn" data-power="low">
                        محلي
                    </button>
                </div>
                <div class="fallback-note" id="fallback-note" style="display:none;"></div>
            </div>

            <!-- Mode Selector -->
            <div class="mode-selector">
                <button class="mode-btn" data-mode="concise">
                    إعراب مختصر
                </button>
                <button class="mode-btn active" data-mode="detailed">
                    إعراب مفصّل
                </button>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button class="btn btn-primary" id="analyze-btn">
                    تحليل الجملة
                </button>
                <button class="btn btn-secondary" id="upload-btn">
                    تحليل الصورة
                </button>
            </div>

            <!-- Upload Zone -->
            <div class="upload-zone" id="upload-zone">
                <span class="upload-icon">📷</span>
                <p>اسحب صورة هنا أو اضغط لرفع صورة</p>
                <p class="supported">PNG, JPG, WEBP — حد أقصى 10 ميغابايت</p>
                <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff">
            </div>

            <!-- Upload Preview with Thumbnail -->
            <div class="upload-preview" id="upload-preview">
                <div class="preview-thumbnail" id="preview-thumbnail"></div>
                <div class="preview-info">
                    <span class="filename" id="upload-filename"></span>
                    <button class="preview-show-btn" id="preview-show-btn">عرض الصورة</button>
                </div>
                <button class="remove-btn" id="remove-file" title="إزالة الملف">✕</button>
            </div>

            <!-- Full Image Preview Modal -->
            <div class="image-modal" id="image-modal">
                <div class="image-modal-content">
                    <img id="image-modal-img" src="" alt="معاينة الصورة">
                    <button class="image-modal-close" id="image-modal-close">✕</button>
                </div>
            </div>
        </section>

        <!-- ═══ Results Section ═══ -->
        <section class="card results-section" id="results-section">
            <div class="result-header">
                <div class="card-title">
                    <span class="icon">◈</span>
                    نتيجة التحليل
                </div>
                <span class="tier-badge" id="tier-badge"></span>
            </div>

            <div class="sentence-display">
                <div id="result-sentence"></div>
                <div class="sentence-type" id="sentence-type"></div>
            </div>

            <div class="table-wrapper">
                <table class="analysis-table">
                    <thead id="analysis-head"></thead>
                    <tbody id="analysis-body"></tbody>
                </table>
            </div>
        </section>

        <!-- ═══ Chat Section ═══ -->
        <section class="card chat-section" id="chat-section">
            <div class="chat-header">
                <div class="card-title" style="margin-bottom:0;">
                    <span class="icon">💬</span>
                    المساعد النحوي
                </div>
                <div class="chat-controls">
                    <select class="chat-power-select" id="chat-power-select">
                        <option value="strong">قوي</option>
                        <option value="med">متوسط</option>
                        <option value="low">محلي</option>
                    </select>
                    <button class="chat-clear-btn" id="chat-clear" title="مسح المحادثة">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages"></div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="اسأل عن الجملة المحللة..." autocomplete="off">
                <button class="chat-send-btn" id="chat-send">إرسال</button>
            </div>
        </section>

    </div>

    <!-- ═══ Fixed Footer ═══ -->
    <footer class="app-footer">
        <span class="footer-brand">لِسَان</span> — تحليل النحو العربي بالذكاء الاصطناعي
        <div class="footer-dev">
            تطوير <a href="https://alaadin-alynaey.site/" target="_blank" rel="noopener">Alaadin Alynaey</a>
        </div>
    </footer>

    <!-- ═══ Loading Overlay with Logs ═══ -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loading-text">جارٍ تحليل الجملة...</div>
        <div class="loading-logs" id="loading-logs"></div>
    </div>

    <!-- ═══ Word Exploration Panel ═══ -->
    <div class="panel-overlay" id="panel-overlay"></div>
    <aside class="explore-panel" id="explore-panel">
        <div class="explore-header">
            <h3>استكشاف الكلمة</h3>
            <button class="explore-close" id="explore-close">✕</button>
        </div>
        <div id="explore-content"></div>
    </aside>

    <!-- ═══ Toast ═══ -->
    <div class="toast" id="toast"></div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
